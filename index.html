<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PWA Play">
  <title>PWA Play - Reproductor de Música</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- ============================================================ -->
  <!-- MAIN APP CONTAINER                                           -->
  <!-- ============================================================ -->
  <div class="app-container">

    <!-- ========================================================== -->
    <!-- HEADER / APP BAR                                           -->
    <!-- ========================================================== -->
    <header class="header">
      <div class="header-inner">
        <!-- Logo / Title -->
        <div class="header-left">
          <div class="header-logo">
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </div>
          <h1 class="header-title">
            <span class="gradient-text">CAROL</span>
          </h1>
        </div>

        <!-- Search icon -->
        <button class="btn-icon btn-press">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- Install PWA button -->
        <button class="install-btn btn-press" id="install-btn" style="display:none;" title="Instalar app">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
            <path d="M12 5v14m-7-7h14" stroke-linecap="round"/>
            <path d="M5 12l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 2)"/>
          </svg>
          <span>Instalar</span>
        </button>
      </div>
    </header>

    <!-- ========================================================== -->
    <!-- SECTION: NOW PLAYING (Mini hero when active)                -->
    <!-- ========================================================== -->
    <section class="now-playing-section" id="now-playing-section">
      <p class="section-label">Escuchando ahora</p>
      <div class="now-playing-card">
        <!-- Circular album art -->
        <div class="album-art-wrapper">
          <div class="album-art-circle vinyl-spin" id="mini-art">
            <div class="vinyl-center"></div>
          </div>
          <div class="pulse-indicator" id="pulse-indicator" style="display:none;">
            <div class="pulse-dot"></div>
          </div>
        </div>
        <!-- Song info -->
        <div class="now-playing-info">
          <p class="song-title" id="np-title">Selecciona una canción</p>
          <p class="song-artist" id="np-artist">—</p>
        </div>
        <!-- Mini play button -->
        <button class="mini-play-btn btn-press" id="mini-play-btn">
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- ========================================================== -->
    <!-- SECTION: SONG LIST                                         -->
    <!-- ========================================================== -->
    <section class="library-section">
      <div class="library-header">
        <h2>Tu biblioteca</h2>
        <button class="add-songs-btn btn-press" id="add-songs-btn">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
            <path d="M12 5v14m-7-7h14" stroke-linecap="round"/>
          </svg>
          <span>Agregar</span>
        </button>
        <span class="song-count" id="song-count">0 canciones</span>
      </div>

      <!-- Hidden file input -->
      <input
        type="file"
        id="file-input"
        accept="audio/*"
        multiple
        style="display:none;"
      >

      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" width="48" height="48">
            <path d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 01-.99-3.467l2.31-.66A2.25 2.25 0 009 15.553z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="empty-title">No hay canciones</p>
        <p class="empty-subtitle">Toca "Agregar" para seleccionar archivos de música de tu teléfono</p>
        <button class="empty-btn btn-press" id="empty-add-btn">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="20" height="20">
            <path d="M12 5v14m-7-7h14" stroke-linecap="round"/>
          </svg>
          Seleccionar música
        </button>
      </div>

      <!-- Song list (populated by JS) -->
      <div class="song-list" id="song-list"></div>
    </section>

    <!-- ========================================================== -->
    <!-- FIXED BOTTOM PLAYER                                        -->
    <!-- ========================================================== -->
    <div class="bottom-player">
      <div class="player-glass">

        <!-- Progress bar -->
        <div class="progress-section">
          <div class="progress-container">
            <div class="progress-track-bg">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <input
              type="range"
              min="0"
              max="100"
              value="0"
              class="progress-track"
              id="progress-bar"
            >
          </div>
          <div class="time-labels">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>

        <!-- Player controls (centered, large) -->
        <div class="player-controls">
          <!-- Previous -->
          <button class="ctrl-btn prev btn-press" id="btn-prev">
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>

          <!-- Play/Pause -->
          <button class="ctrl-btn play-pause btn-press" id="btn-play-pause">
            <svg fill="currentColor" viewBox="0 0 24 24" id="icon-play">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg fill="currentColor" viewBox="0 0 24 24" id="icon-pause" style="display:none;">
              <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
            </svg>
          </button>

          <!-- Next -->
          <button class="ctrl-btn next btn-press" id="btn-next">
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>
        </div>

      </div>
    </div>

  </div>

  <!-- Audio element (hidden) -->
  <audio id="audio-player"></audio>

  <!-- App Logic -->
  <script src="app.js"></script>
</body>
</html>
